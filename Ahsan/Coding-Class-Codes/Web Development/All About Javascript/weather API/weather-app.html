<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Weather</title>
<style>
  :root {
    --sky-top: #1c2e4a;
    --sky-bottom: #3d5a80;
    --card: #f7f9fc;
    --ink: #24303f;
    --muted: #6b7a8c;
    --accent: #e0a020;
    --line: #d8e0ea;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(170deg, var(--sky-top), var(--sky-bottom));
  }

  .card {
    background: var(--card);
    color: var(--ink);
    width: 100%;
    max-width: 420px;
    border-radius: 14px;
    padding: 36px 32px;
    box-shadow: 0 20px 50px rgba(10, 20, 40, 0.45);
  }

  h1 {
    font-size: 26px;
    font-weight: normal;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .subtitle {
    font-family: Verdana, sans-serif;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  label {
    display: block;
    font-family: Verdana, sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  select {
    width: 100%;
    padding: 12px 14px;
    font-family: Verdana, sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }

  select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button {
    width: 100%;
    margin-top: 16px;
    padding: 13px;
    font-family: Verdana, sans-serif;
    font-size: 14px;
    letter-spacing: 0.5px;
    color: #fff;
    background: var(--sky-top);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: #2a4166; }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button:disabled {
    opacity: 0.6;
    cursor: wait;
  }

  .result {
    margin-top: 28px;
    border-top: 1px solid var(--line);
    padding-top: 24px;
    display: none;
  }

  .result.visible { display: block; }

  .city-name {
    font-size: 20px;
    margin-bottom: 18px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px dashed var(--line);
  }

  .row:last-child { border-bottom: none; }

  .row .label {
    font-family: Verdana, sans-serif;
    font-size: 12px;
    color: var(--muted);
  }

  .row .value {
    font-size: 22px;
  }

  .row .value .unit {
    font-size: 13px;
    color: var(--muted);
  }

  .status {
    margin-top: 20px;
    font-family: Verdana, sans-serif;
    font-size: 13px;
    color: var(--muted);
    display: none;
  }

  .status.visible { display: block; }

  .status.error { color: #b3382c; }
</style>
</head>
<body>

  <div class="card">
    <h1>City Weather</h1>
    <p class="subtitle">Current conditions from WeatherAPI</p>

    <label for="citySelect">Choose a city</label>
    <select id="citySelect">
      <option value="east brunswick">East Brunswick</option>
      <option value="new york">New York</option>
      <option value="london">London</option>
      <option value="paris">Paris</option>
      <option value="tokyo">Tokyo</option>
      <option value="dubai">Dubai</option>
      <option value="lahore">Lahore</option>
      <option value="sydney">Sydney</option>
    </select>

    <button id="findBtn">Find weather</button>

    <p class="status" id="status"></p>

    <div class="result" id="result">
      <p class="city-name" id="cityName"></p>

      <div class="row">
        <span class="label">Temperature</span>
        <span class="value">
          <span id="tempC"></span><span class="unit"> °C</span>
        </span>
      </div>

      <div class="row">
        <span class="label">Temperature</span>
        <span class="value">
          <span id="tempF"></span><span class="unit"> °F</span>
        </span>
      </div>

      <div class="row">
        <span class="label">Wind</span>
        <span class="value">
          <span id="wind"></span><span class="unit"> kph</span>
        </span>
      </div>
    </div>
  </div>

<script>
  const API_KEY = "0f9f65342419461e869235451260607";
  const BASE_URL = "https://api.weatherapi.com/v1/current.json";

  const citySelect = document.getElementById("citySelect");
  const findBtn = document.getElementById("findBtn");
  const result = document.getElementById("result");
  const status = document.getElementById("status");
  const cityName = document.getElementById("cityName");
  const tempC = document.getElementById("tempC");
  const tempF = document.getElementById("tempF");
  const wind = document.getElementById("wind");

  findBtn.addEventListener("click", async () => {
    const city = citySelect.value;
    const url = `${BASE_URL}?key=${API_KEY}&q=${encodeURIComponent(city)}`;

    findBtn.disabled = true;
    result.classList.remove("visible");
    status.textContent = "Loading…";
    status.classList.add("visible");
    status.classList.remove("error");

    try {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`Request failed (${response.status})`);
      }

      const data = await response.json();

      cityName.textContent = `${data.location.name}, ${data.location.country}`;
      tempC.textContent = data.current.temp_c;
      tempF.textContent = data.current.temp_f;
      wind.textContent = data.current.wind_kph;

      status.classList.remove("visible");
      result.classList.add("visible");
    } catch (err) {
      status.textContent = "Could not load weather. Check your connection and try again.";
      status.classList.add("error");
    } finally {
      findBtn.disabled = false;
    }
  });
</script>

</body>
</html>
