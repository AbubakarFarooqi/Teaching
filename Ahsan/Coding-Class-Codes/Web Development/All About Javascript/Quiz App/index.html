<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="quiz" class="quiz">
        <div class="question">
            <div class="quiz-title">
                <span class="title">Quiz App</span>
            </div>
                <div class="questions-and-time">
                    <span class="number-of-questions" id="numberOfQuestions">Question 0/5</span>
                    <span class="time" id="time">Time: </span>
                </div>
                <span id="question" class="question-topic"></span>
                <div class="answers">   
                    <button id="op1"class="answer"></button>
                    <button id="op2"class="answer"></button>
                    <button id="op3"class="answer"></button>
                    <button id="op4"class="answer"></button>
                </div>
            
                
            <button class="btn" id="btn">Next</button>
        </div> 
    </div>
    
    <div id="result" class="result-screen">
        <div class="quiz-title">
                <span class="title">Quiz App</span>
        </div>
        <span class="score" id="score">Your Score: 0/5</span>
        <span class="correct-answers">Correct Answers</span>
        <div id="questionResultsParent" class="questions-result">
            
        </div>
        <button class="result-screen-btn" id="restartBtn">Restart Quiz</button>
    </div>
</body>
<script src="script.js"></script>
</html>
